<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gastos</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="auth card">
      <p class="eyebrow">Gastos personales</p>
      <h1>Gastos</h1>
      <div class="tabs">
        <button class="tab active" type="button" data-mode="login">Entrar</button>
        <button class="tab" type="button" data-mode="register">Crear cuenta</button>
      </div>
      <form id="auth-form">
        <label>Usuario <input name="username" required minlength="3" maxlength="20" autocomplete="username" /></label>
        <label>Contrasena <input name="password" type="password" required minlength="6" autocomplete="current-password" /></label>
        <p id="auth-error" class="error" hidden></p>
        <button id="auth-submit" class="primary" type="submit">Entrar</button>
      </form>
    </section>
    <section id="app-view" class="app hidden">
      <header>
        <div>
          <p class="eyebrow">Vanilla JS · Mongo</p>
          <h1>Gastos</h1>
        </div>
        <div class="who">
          <strong id="user-name"></strong>
          <button id="logout" class="ghost" type="button">Salir</button>
        </div>
      </header>
      <section class="layout">
        <aside class="card">
          <p class="total">Total <strong id="total">$ 0</strong></p>
          <input id="search" type="search" placeholder="Buscar concepto" />
          <nav id="categories"></nav>
        </aside>
        <section>
          <form id="expense-form" class="card form">
            <input id="title" placeholder="Concepto" maxlength="80" required />
            <input id="amount" type="number" min="0.01" step="0.01" placeholder="Monto" required />
            <input id="category" placeholder="Categoria" maxlength="32" />
            <input id="spentAt" type="date" />
            <input id="note" placeholder="Nota" maxlength="240" />
            <p id="form-error" class="error" hidden></p>
            <div class="row">
              <button class="primary" type="submit">Guardar</button>
              <button id="cancel" class="ghost" type="button" hidden>Cancelar</button>
              <button id="remove" class="danger" type="button" hidden>Borrar</button>
            </div>
          </form>
          <ul id="list"></ul>
        </section>
      </section>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
